# Example reverse proxy: HTTPS + static site + /api → FastAPI
# (Production wonderbaboon.com uses Hostinger — see deploy/HOSTINGER.md and frontend/.htaccess)
# Replace YOUR_DOMAIN and upstream port; install TLS certs (e.g. certbot).

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # Never serve source / tooling / hidden files
    location ~ ^/(node_modules|src|scripts|backend)(/|$) { return 404; }
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(ts|map|env|log|py|sh|md)$ { return 404; }
    location ~* ^/(package(-lock)?\.json|tsconfig\.json|serve\.json)$ { return 404; }

    root /var/www/wonder-baboon/frontend;
    index index.html;

    location /api/ {
        client_max_body_size 64m;  # photo/itinerary uploads; the API enforces its own per-route limits
        proxy_pass http://127.0.0.1:5051/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /version-check.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(html|htm)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Redirect legacy .html URLs to clean paths (bookmark / search friendly)
    location = /index.html {
        return 301 /$is_args$args;
    }
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # Extensionless pages: /upcoming-trips → upcoming-trips.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
